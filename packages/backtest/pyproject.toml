[project]
name = "polyecho-backtest"
version = "0.0.0"
description = "Backtest engine: simulates copy-trading PnL with slippage and delay models"
requires-python = ">=3.12"
dependencies = [
    "polyecho-shared",
    "numpy>=2.0",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyecho"]
