[project]
name = "polyecho-discovery"
version = "0.0.0"
description = "Discovery-worker: finds, scores, and tracks leader candidates on Polymarket"
requires-python = ">=3.12"
dependencies = [
    "polyecho-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyecho"]
