[project]
name = "polyecho-shared"
version = "0.0.0"
description = "PolyEcho shared library: Polymarket client, ORM models, db, config, crypto"
requires-python = ">=3.12"
dependencies = [
  # P0-6: exact pin (supply-chain). The trading SDK owns EIP-712/HMAC/
  # rounding for live orders; an unpinned range would let a future release
  # silently change signing/transport. 1.0.1 == the version in uv.lock
  # (verified). py-builder-relayer-client is deliberately NOT declared:
  # gasless deploy is delegated to the off-chain relayer (no client lib).
  "py-clob-client-v2==1.0.1",
  "sqlalchemy[asyncio]>=2.0.49",
  "asyncpg>=0.30",
  "pydantic>=2",
  "pydantic-settings>=2",
  "cryptography>=43",
  "structlog>=24",
  "httpx>=0.27",
  "py-vapid>=1.9",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyecho"]
