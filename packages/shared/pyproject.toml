[project]
name = "polyecho-shared"
version = "0.0.0"
description = "PolyEcho shared library: Polymarket client, ORM models, db, config, crypto"
requires-python = ">=3.12"
dependencies = [
  # P0-6: exact pin (supply-chain). The trading SDK owns EIP-712/HMAC/
  # rounding for live orders; an unpinned range would let a future release
  # silently change signing/transport. 1.0.1 == the version in uv.lock
  # (verified). py-builder-relayer-client is declared as an OPTIONAL extra
  # (``relayer``) below — gasless SAFE (signature_type=2) redeem is the
  # only path that needs it, and hosts that only run EOA wallets never
  # pay the install cost.  See polyecho.shared.polymarket.relayer for
  # the lazy-import contract.
  "py-clob-client-v2==1.0.1",
  "sqlalchemy[asyncio]>=2.0.49",
  "asyncpg>=0.30",
  "pydantic>=2",
  "pydantic-settings>=2",
  "cryptography>=43",
  "structlog>=24",
  "httpx>=0.27",
  "py-vapid>=1.9",
]

[project.optional-dependencies]
test = [
  "pytest>=9.1.1",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]
# Phase-4 P3: gasless SAFE (signature_type=2) redeem via the official
# Builder-Relayer.  The SDK is sync (requests) and we wrap it via
# asyncio.to_thread in polyecho.shared.polymarket.relayer.  Hosts that
# only run EOA wallets do NOT need this extra; the relayer module
# imports the SDK lazily and fails closed with RelayerNotAvailableError
# if the package is missing.
relayer = [
  # sig 2 SAFE (TransactionType.SAFE) via the official client.
  "py-builder-relayer-client>=0.0.1",
  # sig 1 (POLY_PROXY) + sig 3 (POLY_1271 / Deposit-Wallet) gasless
  # redeem: ``polyecho.shared.polymarket.relayer_extended`` consumes the
  # builder HMAC signing surface from py-builder-signing-sdk (POLY_BUILDER_*
  # headers) — same orthogonal-to-tx-type pattern the brief calls out.
  "py-builder-signing-sdk>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyecho"]
