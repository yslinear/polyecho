[project]
name = "polyecho-shared"
version = "0.0.0"
description = "PolyEcho shared library: Polymarket client, ORM models, db, config, crypto"
requires-python = ">=3.12"
dependencies = [
  "py-clob-client-v2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "pydantic>=2",
  "pydantic-settings>=2",
  "cryptography>=43",
  "structlog>=24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyecho"]
