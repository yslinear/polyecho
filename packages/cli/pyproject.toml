[project]
name = "polyecho-cli"
version = "0.0.0"
description = "PolyEcho command-line tool"
requires-python = ">=3.12"
dependencies = ["polyecho-shared", "typer>=0.15", "rich>=13", "httpx>=0.28"]

[project.scripts]
polyecho = "polyecho.cli.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyecho"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "RET", "SIM", "TCH", "ANN", "PL"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
