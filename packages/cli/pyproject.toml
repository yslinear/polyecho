[project]
name = "polyecho-cli"
version = "0.0.0"
description = "PolyEcho command-line tool"
requires-python = ">=3.12"
dependencies = ["polyecho-shared", "typer>=0.27.1", "rich>=13", "httpx>=0.28"]

[project.scripts]
polyecho = "polyecho.cli.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyecho"]

# NOTE: ruff / mypy / pytest config is intentionally centralized in the
# repo-root pyproject.toml (single source of truth). Per-package tool
# blocks were removed so `ruff check .` / `mypy packages/` are consistent.
