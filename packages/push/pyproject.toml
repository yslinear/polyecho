[project]
name = "polyecho-push"
version = "0.0.0"
description = "Web-push-sender: polls events table and delivers VAPID Web Push notifications"
requires-python = ">=3.12"
dependencies = [
    "polyecho-shared",
    "pywebpush>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyecho"]
