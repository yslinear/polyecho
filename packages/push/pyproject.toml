[project]
name = "polyecho-push"
version = "0.0.0"
description = "Web-push-sender: polls events table and delivers VAPID Web Push notifications"
requires-python = ">=3.12"
dependencies = [
    "polyecho-shared",
    "pywebpush>=2.4.0",
    # APScheduler 3.x AsyncIOScheduler drives the 23:00 daily-PnL cron job.
    # Pinned <4 — the 4.x rewrite (Scheduler/AsyncScheduler) is a different,
    # still-evolving API; the 3.x AsyncIOScheduler API is stable.
    "apscheduler>=3.10,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyecho"]
