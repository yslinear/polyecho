[project]
name = "polyecho-paper"
version = "0.0.0"
description = "Paper-trading worker: forward shadow-copy ladder for leader candidates (C1)"
requires-python = ">=3.12"
dependencies = [
    "polyecho-shared",
    "polyecho-discovery",
    "polyecho-backtest",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyecho"]

# NOTE: ruff / mypy / pytest config is intentionally centralized in the
# repo-root pyproject.toml (single source of truth). Per-package tool
# blocks were removed so `ruff check .` / `mypy packages/` are consistent.
