[project]
name = "polyecho-core"
version = "0.0.0"
description = "Trader-core: holds private keys, executes copy-trades on Polymarket"
requires-python = ">=3.12"
dependencies = [
    "polyecho-shared",
    "websockets>=13.0",
    "web3>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyecho"]
