# PolyEcho — Python workspace root (uv virtual workspace).
# Per PRD §4.4: all Python packages share the implicit-namespace package `polyecho` (PEP 420).
# `packages/web` is a Node package and is intentionally NOT a uv workspace member.

[tool.uv.workspace]
members = [
    "packages/shared",
    "packages/core",
    "packages/discovery",
    "packages/backtest",
    "packages/push",
    "packages/cli",
    "packages/detect",
    "packages/paper",
]

[tool.uv.sources]
polyecho-shared = { workspace = true }
polyecho-core = { workspace = true }
polyecho-discovery = { workspace = true }
polyecho-backtest = { workspace = true }
polyecho-push = { workspace = true }
polyecho-detect = { workspace = true }
polyecho-paper = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
]

# ── Lint / type / test config: SINGLE SOURCE OF TRUTH (root only) ───────────
# Per-package [tool.ruff*]/[tool.mypy*]/[tool.pytest*] blocks were intentionally
# removed so `ruff check .` and `mypy packages/` are consistent everywhere.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src"]

[tool.ruff.lint]
# Intentional rule set: pycodestyle errors (E), pyflakes (F), import sorting (I),
# pyupgrade (UP), bugbear (B), and async pitfalls (ASYNC). ANN*/PL* are
# deliberately out of scope for Phase 0 (style-only, high-churn) and may be
# broadened in a later phase.
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use bare asserts and inline literals.
"packages/*/tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
# All packages share the PEP 420 `polyecho` namespace under a src layout.
# Without these src roots on the path, `mypy packages/` resolves each file
# both as `packages.<pkg>.src.polyecho.…` and `polyecho.…` ("found twice").
mypy_path = [
    "packages/shared/src",
    "packages/core/src",
    "packages/discovery/src",
    "packages/backtest/src",
    "packages/push/src",
    "packages/cli/src",
    "packages/detect/src",
    "packages/paper/src",
]

# Phase-0 stubs: trader-core and web-push-sender are skeletons whose
# implementations land later. Re-enable strict in Phase 4 (core) / Phase 5
# (push). Scoped here (not silenced globally) so shared/discovery/backtest/cli
# stay fully strict-typed.
[[tool.mypy.overrides]]
module = ["polyecho.core.*", "polyecho.push.*"]
ignore_errors = true

# `pandas` ships no inline types and `pandas-stubs` is not in the frozen
# uv.lock; this is the documented, narrowly-scoped exception for a single
# third-party lib (not a blanket ignore_missing_imports).
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

# `py_vapid` (VAPID keypair / claims helper used by shared.vapid) ships no
# inline types nor a `py.typed` marker and no stub package is in the frozen
# uv.lock; same documented, narrowly-scoped single-lib exception as pandas.
[[tool.mypy.overrides]]
module = ["py_vapid", "py_vapid.*"]
ignore_missing_imports = true

# `py_builder_relayer_client` and `py_builder_signing_sdk` are declared as
# the SHARED package's optional [relayer] extra. CI / byte-mirror docker
# (`uv sync --frozen --dev`) does NOT install extras, so these imports are
# unresolvable at type-check time. They are consumed exclusively inside
# lazy try/except ImportError blocks in shared.polymarket.relayer and
# shared.polymarket.relayer_extended which raise RelayerNotAvailableError
# (fail-closed) when missing. Same narrowly-scoped pattern as pandas/py_vapid.
[[tool.mypy.overrides]]
module = ["py_builder_relayer_client.*", "py_builder_signing_sdk.*"]
ignore_missing_imports = true

# `py_clob_client_v2` ships no `py.typed` marker; same narrow single-lib
# exception. Used by the public-endpoint smoke test to confirm
# `ClobClient.get_server_time()` round-trips against the real CLOB.
[[tool.mypy.overrides]]
module = ["py_clob_client_v2", "py_clob_client_v2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
# Monorepo with per-package `tests/` dirs sharing module basenames:
# importlib mode + namespace packages avoids the prepend-mode collision.
# Coverage is wired into addopts (not the CI step) so the canonical
# `pytest` invocation — with no path args — always enforces the gate.
# --cov-fail-under is set CONSERVATIVELY below measured coverage so it acts
# as a regression floor, never a flaky failure while packages/** evolves.
#
# IMPORTANT — this 70% is the WHOLE-SUITE gate over the UNION of all
# packages/*/src. It is the floor for aggregate regression only and, on its
# own, MATHEMATICALLY MASKS low coverage in any single package: the
# heavily-tested `shared` package alone can keep the union ≥70 even if the
# money-path `core` were near zero (the R19/R20 "false confidence" root).
# It is therefore deliberately NOT the only gate. A SEPARATE, additive,
# CI-failing per-package money-path floor (`packages/core/src` ≥ 80) is
# enforced by the dedicated "Per-package money-path coverage floor" step in
# .github/workflows/ci.yml. That step measures core IN ISOLATION via
# `coverage report --include='*/packages/core/src/polyecho/core/*'`
# (report-time --include is honoured even though [run] source is set, unlike
# [run] include) so the number is honest core-only coverage, not the union
# artifact. Do not raise/lower either gate to make the other pass.
addopts = "--import-mode=importlib --cov --cov-report=term-missing --cov-fail-under=70"
consider_namespace_packages = true
# Custom markers — registered so `pytest --strict-markers` (and future
# enablement of `filterwarnings = error`) does not flag tests carrying
# them.  ``network`` is the only opt-in marker today: see
# packages/shared/tests/test_public_endpoint_smoke.py — those tests hit
# real public Polymarket / Polygon endpoints and are gated by
# ``POLYECHO_RUN_NETWORK_TESTS=1`` so the byte-mirror / CI default run
# stays hermetic (no IP leak, no upstream flake).
markers = [
    "network: integration tests hitting real public endpoints (opt-in via POLYECHO_RUN_NETWORK_TESTS=1)",
]

# ── Coverage: scoped to packages/*/src (the shipped code), single source ─────
[tool.coverage.run]
branch = true
source = [
    "packages/shared/src",
    "packages/core/src",
    "packages/discovery/src",
    "packages/backtest/src",
    "packages/push/src",
    "packages/cli/src",
    "packages/detect/src",
]

[tool.coverage.report]
show_missing = true
# `--cov-fail-under=70` is the hard gate (measured ≈82% on 2026-05-17, with a
# ~12-point safety margin so concurrent test/code changes never falsely fail).
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
