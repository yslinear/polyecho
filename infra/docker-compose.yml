# PolyEcho — Production Docker Compose
# PRD §4.2 security model:
#   - trader-core holds the private key and opens NO ports
#   - db binds to 127.0.0.1 only; dashboard-web is published on 0.0.0.0:3006
#     per explicit operator request (no-auth UI exposed beyond loopback —
#     accepted; remote access is the operator's responsibility, PRD §5.9)
#   - all Python services communicate via Postgres only
#
# Build context for all Python images: repo root (uv workspace requires it)
# Build context for web: repo root (pnpm workspace root)
#
# Usage:
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml run --rm cli polyecho doctor

name: polyecho

# ── Shared build context helpers ──────────────────────────────────────────────
x-python-build: &python-build
  context: ..
  dockerfile: infra/docker/Dockerfile.python

x-python-defaults: &python-defaults
  env_file:
    - path: ../.env
      required: false
  # Self-sufficient defaults so `docker compose up` works with ZERO extra files.
  # In-container the DB host is `db` (compose service), NOT localhost. A real
  # ../.env (loaded above) still overrides these because env_file wins over
  # `environment` only when the var is set there — so we use ${VAR:-default}
  # which yields the container default unless the host shell/.env exports it.
  #
  # POLYECHO_DATASOURCE default is `live` (production-safe): operator-facing
  # services read the real Polymarket feed and never emit synthetic
  # copy_fill events that could surface as real-looking notifications.
  # fixture mode is now EXPLICIT opt-in — CI / local tests start the stack
  # with `POLYECHO_DATASOURCE=fixture docker compose up`.
  # POLYECHO_LIVE_TRADING is the §5 G5 trading lock; default `off` means
  # trader-core observes + writes audit events but issues NO real orders.
  # Flip to `on` only after an end-to-end dry-run sign-off.
  environment:
    POLYECHO_DB_URL: ${POLYECHO_DB_URL:-postgresql+asyncpg://polyecho:${POSTGRES_PASSWORD}@db:5432/polyecho}
    # POLYECHO_DB_URL_DRIZZLE is the SAME database, just a different DSN
    # dialect (no `+asyncpg`) used by web's Drizzle ORM. Python services
    # never read it BUT shared.config.Settings parses both fields from env
    # on import, and the live-mode validator rejects a localhost sentinel
    # for either — so every Python service needs a non-localhost default
    # here too, or migrate / core / push / discovery / backtest all crash
    # on `get_settings()` before doing anything.
    POLYECHO_DB_URL_DRIZZLE: ${POLYECHO_DB_URL_DRIZZLE:-postgresql://polyecho:${POSTGRES_PASSWORD}@db:5432/polyecho}
    POLYECHO_DATASOURCE: ${POLYECHO_DATASOURCE:-live}
    POLYECHO_LIVE_TRADING: ${POLYECHO_LIVE_TRADING:-off}
  # Ordering: db healthy → migrate completed-successfully → apps.
  # Every app service waits for the one-shot `migrate` job so a clean
  # `docker compose up` on an EMPTY volume yields a fully-populated schema
  # before any worker connects (root cause fix for "empty DB → crash").
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  # NOTE: container_name is intentionally NOT set on any service, and the
  # pgdata volume has no fixed `name:`. Compose derives project-scoped names
  # (e.g. <project>-db-1, <project>_pgdata) from `-p/COMPOSE_PROJECT_NAME`
  # (default: polyecho). This lets an isolated second project
  # (`docker compose -p other up`) run alongside a live stack WITHOUT
  # colliding on a global container/volume name. Operators who relied on the
  # old fixed names (polyecho-db, polyecho_pgdata) should now address
  # resources by the project-scoped names or via `docker compose` directly.
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: polyecho
      POSTGRES_USER: polyecho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bind to localhost only — never expose to network (PRD §4.2)
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyecho -d polyecho"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── migrate (one-shot schema bootstrap) ──────────────────────────────────────
  # Runs `polyecho db migrate` ONCE against a healthy DB, applies the
  # idempotent infra/migrations/0000_init.sql, then exits 0. Every app
  # service depends on this completing successfully, so the stack is
  # self-sufficient: a fresh volume is populated before any worker starts.
  # `restart: "no"` — a job, not a daemon. POLYECHO_DB_MIGRATE_YES=1 because
  # the container has no TTY (the migrate confirmation gate).
  migrate:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.cli
    command: ["db", "migrate"]
    env_file:
      - path: ../.env
        required: false
    # Dockerfile.cli ships /app/packages but NOT infra/. The migration SQL
    # is mounted read-only at /app/infra so _migration_path()'s repo-root
    # walk finds /app (which has both packages/ and infra/) — keeps the
    # image build-context-only and the SQL the single source of truth on
    # the host (no stale baked-in copy).
    volumes:
      - ./migrations:/app/infra/migrations:ro
    environment:
      POLYECHO_DB_URL: ${POLYECHO_DB_URL:-postgresql+asyncpg://polyecho:${POSTGRES_PASSWORD}@db:5432/polyecho}
      # See anchor comment — Settings parses BOTH DSNs on import, and the
      # live-mode validator rejects localhost defaults for either, so the
      # migrate one-shot needs the drizzle URL too even though it never
      # opens a drizzle connection (cli/__main__.py → get_settings()).
      POLYECHO_DB_URL_DRIZZLE: ${POLYECHO_DB_URL_DRIZZLE:-postgresql://polyecho:${POSTGRES_PASSWORD}@db:5432/polyecho}
      POLYECHO_DATASOURCE: ${POLYECHO_DATASOURCE:-live}
      POLYECHO_DB_MIGRATE_YES: "1"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── trader-core ──────────────────────────────────────────────────────────────
  # Holds the private key. Opens NO ports (PRD §4.2 hard requirement).
  core:
    build:
      <<: *python-build
      args:
        PACKAGE: core
    <<: *python-defaults
    # NO ports — key isolation (PRD §4.2 / §5 G5)

  # ── discovery-worker ─────────────────────────────────────────────────────────
  discovery:
    build:
      <<: *python-build
      args:
        PACKAGE: discovery
    <<: *python-defaults
    # NO ports

  # ── backtest-worker ──────────────────────────────────────────────────────────
  # Polls backtest_jobs WHERE status='pending', runs BacktestEngine, writes
  # result JSONB + status→'completed'. Runs `python -m polyecho.backtest`
  # (Dockerfile ENTRYPOINT resolves PACKAGE=backtest). PRD §5.4.
  backtest:
    build:
      <<: *python-build
      args:
        PACKAGE: backtest
    <<: *python-defaults
    # NO ports — DB-only communication (PRD §4.2)

  # ── web-push-sender ──────────────────────────────────────────────────────────
  push:
    build:
      <<: *python-build
      args:
        PACKAGE: push
    <<: *python-defaults
    # NO ports (sends outbound VAPID push only)

  # ── dashboard-web (Next.js 15) ────────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    env_file:
      - path: ../.env
        required: false
    # Self-sufficient default — in-container the DB host is `db`, not localhost.
    # A real ../.env still overrides via ${VAR:-default}.
    environment:
      POLYECHO_DB_URL: ${POLYECHO_DB_URL:-postgresql+asyncpg://polyecho:${POSTGRES_PASSWORD}@db:5432/polyecho}
      POLYECHO_DB_URL_DRIZZLE: ${POLYECHO_DB_URL_DRIZZLE:-postgresql://polyecho:${POSTGRES_PASSWORD}@db:5432/polyecho}
      # The container still LISTENS on 3000 (see healthcheck below, unchanged)
      # but is PUBLISHED on :3006 — so the browser's Origin/Host is :3006.
      # The CSRF middleware allow-list keys off POLYECHO_WEB_PORT, so it must
      # be the PUBLISHED port for localhost:3006 to pass. Internal listen port
      # is unaffected (Next binds to 3000 regardless of this var).
      POLYECHO_WEB_PORT: "3006"
      # Operator opt-in (PRD §5.9): pass a host-side
      # POLYECHO_WEB_ALLOWED_ORIGINS (comma-separated absolute origins, e.g.
      # the operator's tailnet origin http://<host>.tailXXXX.ts.net:3006)
      # through to the container so mutating Server Actions work over
      # Tailscale. Blank unless the operator exports it / sets it in ../.env —
      # the tracked default stays localhost-only. No tailnet host is
      # hardcoded here on purpose.
      POLYECHO_WEB_ALLOWED_ORIGINS: ${POLYECHO_WEB_ALLOWED_ORIGINS:-}
    # web is all DB-querying Server Components — it must not start until the
    # schema exists, same ordering guarantee as the Python workers.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # HTTP healthcheck so `restart: unless-stopped` can detect a hung-but-alive
    # Next.js process (the runtime image is node:slim — no curl/wget — so probe
    # with a tiny Node one-liner; exits 0 only on HTTP 200 from `/`).
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Bind to localhost only — not exposed; remote access out of scope (PRD §5.9)
    # Operator-requested: dashboard published on 0.0.0.0:3006 so it is
    # reachable over Tailscale (mac-mini.tail3e1efb.ts.net:3006). NOTE:
    # 0.0.0.0 also exposes the no-auth dashboard on EVERY interface incl.
    # the LAN — explicitly accepted by the operator (see Security Model).
    ports:
      - "0.0.0.0:3006:3000"

  # ── CLI (on-demand, profile=tools) ───────────────────────────────────────────
  # Start with: docker compose -f infra/docker-compose.yml run --rm cli polyecho doctor
  cli:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.cli
    env_file:
      - path: ../.env
        required: false
    # Self-sufficient defaults — in-container the DB host is `db`, not
    # localhost. A real ../.env still overrides via ${VAR:-default}.
    environment:
      POLYECHO_DB_URL: ${POLYECHO_DB_URL:-postgresql+asyncpg://polyecho:${POSTGRES_PASSWORD}@db:5432/polyecho}
      POLYECHO_DB_URL_DRIZZLE: ${POLYECHO_DB_URL_DRIZZLE:-postgresql://polyecho:${POSTGRES_PASSWORD}@db:5432/polyecho}
      POLYECHO_DATASOURCE: ${POLYECHO_DATASOURCE:-live}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools
    # No restart — on-demand only

# ── Volumes ───────────────────────────────────────────────────────────────────
# No fixed `name:` — Compose derives a project-scoped volume name
# (<project>_pgdata) so an isolated second project does not collide with a
# running stack's data volume. `docker compose down -v` still removes it.
volumes:
  pgdata: {}
