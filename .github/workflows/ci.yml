name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Python: lint, type-check, test ──────────────────────────────────────────
  python:
    name: Python (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy type-check
        run: uv run mypy packages/

      - name: Pytest (fixture datasource — hermetic, no network)
        run: uv run pytest
        env:
          POLYECHO_DATASOURCE: fixture

  # ── Schema sanity: spin postgres:16, apply baseline, verify tables ───────────
  schema:
    name: Schema sanity (postgres:16 + 0000_init.sql)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: polyecho
          POSTGRES_USER: polyecho
          POSTGRES_PASSWORD: polyecho
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polyecho -d polyecho"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Apply baseline migration
        run: |
          psql postgresql://polyecho:polyecho@localhost:5432/polyecho \
            -f infra/migrations/0000_init.sql

      - name: Schema sanity check — list tables
        run: |
          psql postgresql://polyecho:polyecho@localhost:5432/polyecho \
            -c "\dt" | tee /tmp/tables.txt
          # Verify all 12 expected tables exist
          for tbl in accounts candidate_leaders candidate_score_history \
                     copy_templates follow_relations leader_trades my_trades \
                     settings backtest_jobs pending_actions push_subscriptions \
                     events; do
            grep -q "$tbl" /tmp/tables.txt \
              || { echo "MISSING TABLE: $tbl"; exit 1; }
          done
          echo "All 12 tables present."

  # ── Web: lint + build ────────────────────────────────────────────────────────
  web:
    name: Web (pnpm lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>/dev/null || pnpm install

      - name: Lint
        run: pnpm --filter @polyecho/web lint

      - name: Build (Next.js standalone)
        run: pnpm --filter @polyecho/web build
        env:
          # Dummy values so Next.js build doesn't fail on missing env vars
          POLYECHO_DB_URL_DRIZZLE: postgresql://polyecho:polyecho@localhost:5432/polyecho

  # ── Docker: build all images to catch Dockerfile breakage ───────────────────
  docker:
    name: Docker (build all images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Validate docker-compose config
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Build python/core image
        run: |
          docker build \
            -f infra/docker/Dockerfile.python \
            --build-arg PACKAGE=core \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to   type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t polyecho/core:ci \
            .

      - name: Build python/discovery image
        run: |
          docker build \
            -f infra/docker/Dockerfile.python \
            --build-arg PACKAGE=discovery \
            --cache-from type=local,src=/tmp/.buildx-cache \
            -t polyecho/discovery:ci \
            .

      - name: Build python/push image
        run: |
          docker build \
            -f infra/docker/Dockerfile.python \
            --build-arg PACKAGE=push \
            --cache-from type=local,src=/tmp/.buildx-cache \
            -t polyecho/push:ci \
            .

      - name: Build cli image
        run: |
          docker build \
            -f infra/docker/Dockerfile.cli \
            --cache-from type=local,src=/tmp/.buildx-cache \
            -t polyecho/cli:ci \
            .

      - name: Build web image
        run: |
          docker build \
            -f infra/docker/Dockerfile.web \
            --cache-from type=local,src=/tmp/.buildx-cache \
            -t polyecho/web:ci \
            .
        # Web build may fail without a real DB at build time; that's expected.
        # The job validates the Dockerfile syntax and layer cacheability.
        continue-on-error: true

      # Rotate cache (avoids unbounded growth)
      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true
